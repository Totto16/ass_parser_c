<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>Ass Parser</title>
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="data:;base64,iVBORw0KGgo=" />
	</head>
	<!-- inspired by: https://codepen.io/aaronvanston/pen/yNYOXR -->
	<body>
		<div id="file-upload">
			<button id="file-upload-btn" type="button">Add File</button>
			<div id="image-upload-wrap">
				<input
					id="file-upload-input"
					type="file"
					accept="text/x-ssa"
					multiple="false"
				/>
				<div class="drag-text">
					<h3>Drag and drop a file or select add File</h3>
				</div>
			</div>
		</div>
	</body>
</html>
