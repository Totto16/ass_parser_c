[host_machine]
system = 'wasm'
cpu_family = 'wasm32'
cpu = 'wasm32'
endian = 'little'

[binaries]
c = 'clang-20'
cpp = 'clang++-20'
ar      = 'llvm-ar-20'
as      = 'llvm-as-20'
ranlib  = 'llvm-ranlib-20'
ld      = 'wasm-ld-20'
strip   = 'llvm-strip-20'
objcopy = 'llvm-objcop-20'
pkg-config = 'false'
llvm-config = 'llvm-config-20'

[built-in options]
c_std = 'c23'
cpp_std = 'c++23'
c_args = ['-fno-builtin', '-Wall', '-Wextra', '-Wswitch-enum', '--target=wasm32', '--no-standard-libraries', '-nodefaultlibs', '-D__WASM__']
c_link_args = ['-Wl,--export-all', '-Wl,--no-entry', '-Wl,--allow-undefined']


[properties]
needs_exe_wrapper = true
