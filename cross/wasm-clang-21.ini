[host_machine]
system = 'wasm'
cpu_family = 'wasm32'
cpu = 'wasm32'
endian = 'little'

[binaries]
c = '@DIRNAME@/clang-21-wrapper.sh'
cpp = 'clang++-21'
ar      = 'llvm-ar-21'
as      = 'llvm-as-21'
ranlib  = 'llvm-ranlib-21'
ld      = 'wasm-ld-21'
c_ld    = 'wasm-ld-21'
strip   = 'llvm-strip-21'
objcopy = 'llvm-objcop-21'
llvm-config = 'llvm-config-21'

[built-in options]
c_std = 'c23'
cpp_std = 'c++23'
c_args = ['-O1', '-fno-builtin', '-Wall', '-Wextra', '-Wpedantic', '-Wswitch-enum', '-Wformat','-Werror=format-security','--target=wasm32', '--no-standard-libraries', '-nodefaultlibs', '-mbulk-memory', '-D__WASM__']
c_link_args = ['--unresolved-symbols=report-all']
default_library = 'static'

[properties]
needs_exe_wrapper = true
c_stdlib = 'custom_wasm_libc'
